name: Android CI & APK Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
  
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run Core Engine Unit Tests
        run: gradle :core-engine:test

      - name: Build Debug APK
        run: gradle :app:assembleDebug
        
      - name: Prepare Release APK
        run: cp app/build/outputs/apk/debug/app-debug.apk SMSShield-v0.1.0-alpha.apk
        
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SMSShield-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish GitHub Pre-Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-alpha
          name: SMSShield v0.1.0-alpha
          prerelease: true
          files: SMSShield-v0.1.0-alpha.apk
          body: |
            ## SMSShield v0.1.0-alpha (Pre-release)
            Offline, lightweight, zero-permission Iranian SMS spam notification filter for Android.
            Install `SMSShield-v0.1.0-alpha.apk` (Android 8.0 / API 26+) and enable Notification Access from the Dashboard. Starts in Learning Mode by default.

            ---

            ## سپر پیامک نسخه v0.1.0-alpha (پیش‌انتشار)
            فیلتر آفلاین، سبک و بدون دسترسی پیامک برای حذف اعلان‌های پیامک‌های تبلیغاتی ایرانی در اندروید.
            فایل `SMSShield-v0.1.0-alpha.apk` را نصب کنید (اندروید ۸ و بالاتر) و از بخش داشبورد دسترسی اعلان‌ها را فعال نمایید. برنامه به‌صورت پیش‌فرض در حالت یادگیری اجرا می‌شود.
